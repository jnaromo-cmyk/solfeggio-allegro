function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function drawQuestionsWithoutRepetition(allowedPhases, count, seenMap) {
  const phasePools = {};
  allowedPhases.forEach((pKey) => {
    const allInPhase = questionsDatabase.filter(
      (q) => (q.isMooExtra ? 'extras' : String(q.fase)) === pKey
    );
    const seenIds = new Set(seenMap[pKey] || []);
    const unseen = allInPhase.filter((q) => !seenIds.has(q.id));
    phasePools[pKey] = {
      all: allInPhase,
      unseen: shuffleArray(unseen)
    };
  });

  const picked = [];
  const usedInThisQuiz = new Set();

  while (picked.length < count) {
    const availablePhaseKeys = allowedPhases.filter((pKey) => {
      const pool = phasePools[pKey];
      return pool && pool.all.length > 0 && pool.all.some((q) => !usedInThisQuiz.has(q.id));
    });

    if (availablePhaseKeys.length === 0) break;

    const phasesWithUnseen = availablePhaseKeys.filter(
      (pKey) => phasePools[pKey].unseen.length > 0
    );
    const candidatePhases =
      phasesWithUnseen.length > 0 ? phasesWithUnseen : availablePhaseKeys;

    const chosenPhase =
      candidatePhases[Math.floor(Math.random() * candidatePhases.length)];
    const pool = phasePools[chosenPhase];

    if (pool.unseen.length === 0) {
      seenMap[chosenPhase] = [];
      pool.unseen = shuffleArray(
        pool.all.filter((q) => !usedInThisQuiz.has(q.id))
      );
    }

    const nextQ = pool.unseen.pop();
    if (nextQ && !usedInThisQuiz.has(nextQ.id)) {
      usedInThisQuiz.add(nextQ.id);
      picked.push(nextQ);
      if (!seenMap[chosenPhase]) seenMap[chosenPhase] = [];
      if (!seenMap[chosenPhase].includes(nextQ.id)) {
        seenMap[chosenPhase].push(nextQ.id);
      }
    }
  }

  return picked;
}

function SolfeggioAllegro() {
  const [appState, setAppState] = React.useState('home');
  const [instrumentProfile, setInstrumentProfile] = React.useState('');
  const [studyLevel, setStudyLevel] = React.useState('');
  const [quizType, setQuizType] = React.useState('');

  const [activeQuestions, setActiveQuestions] = React.useState([]);
  const [currentQuestionIndex, setCurrentQuestionIndex] = React.useState(0);

  // Quiz Mechanics
  const [selectedOption, setSelectedOption] = React.useState(null);
  const [isAnswerConfirmed, setIsAnswerConfirmed] = React.useState(false);
  const [score, setScore] = React.useState({ correct: 0, incorrect: 0 });
  const [userAnswers, setUserAnswers] = React.useState([]);

  // Modals & Timer
  const [isExiting, setIsExiting] = React.useState(false);
  const advanceTimerRef = React.useRef(null);
  const seenMemoryRef = React.useRef({});

  const clearAdvanceTimer = () => {
    if (advanceTimerRef.current) {
      clearTimeout(advanceTimerRef.current);
      advanceTimerRef.current = null;
    }
  };

  React.useEffect(() => {
    return () => clearAdvanceTimer();
  }, []);

  const getSeenMap = () => {
    try {
      const raw = window.localStorage.getItem(STORAGE_SEEN_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        seenMemoryRef.current = parsed;
        return parsed;
      }
    } catch (e) {}
    return { ...seenMemoryRef.current };
  };

  const persistSeenMap = (seenMap) => {
    seenMemoryRef.current = seenMap;
    try {
      window.localStorage.setItem(STORAGE_SEEN_KEY, JSON.stringify(seenMap));
    } catch (e) {}
  };

  // Frase bíblica alternando a cada 5 segundos na tela inicial
  const [verseIndex, setVerseIndex] = React.useState(0);

  React.useEffect(() => {
    if (appState !== 'home') return;
    const timer = setInterval(() => {
      setVerseIndex((prev) => (prev + 1) % bibleVerses.length);
    }, 5000);
    return () => clearInterval(timer);
  }, [appState]);

  const currentVerse = bibleVerses[verseIndex];

  const startQuiz = (selectedQuizType) => {
    clearAdvanceTimer();

    const totalQuestions =
      selectedQuizType === 'rapido' ? 5 :
      selectedQuizType === 'completo' ? 40 : 20;

    const isOficializacao = studyLevel === 'oficializacao';
    const seenMap = getSeenMap();

    let selected = [];

    if (isOficializacao) {
      const advancedPhases = ['8', '9', '10', '11', '12', '13', '14', '15', '16'];
      const baseAndExtrasPhases = ['1', '2', '3', '4', '5', '6', '7', 'extras'];

      const targetAdvanced = Math.floor(totalQuestions * 0.5);
      const targetBaseAndExtras = totalQuestions - targetAdvanced;

      const pickedAdvanced = drawQuestionsWithoutRepetition(
        advancedPhases,
        targetAdvanced,
        seenMap
      );
      const pickedBase = drawQuestionsWithoutRepetition(
        baseAndExtrasPhases,
        targetBaseAndExtras,
        seenMap
      );

      selected = shuffleArray([...pickedAdvanced, ...pickedBase]);
    } else {
      let maxFase = 16;
      if (instrumentProfile === 'musico') {
        if (studyLevel === 'rjm') maxFase = 12;
        if (studyLevel === 'culto') maxFase = 16;
      } else if (instrumentProfile === 'organista') {
        if (studyLevel === 'rjm') maxFase = 11;
        if (studyLevel === 'culto') maxFase = 15;
      }

      const allowedPhases = [];
      for (let i = 1; i <= maxFase; i++) {
        allowedPhases.push(String(i));
      }
      allowedPhases.push('extras');

      selected = shuffleArray(
        drawQuestionsWithoutRepetition(allowedPhases, totalQuestions, seenMap)
      );
    }

    if (!selected || selected.length === 0) {
      selected = shuffleArray(questionsDatabase).slice(0, totalQuestions);
    }

    persistSeenMap(seenMap);

    setActiveQuestions(selected);
    setCurrentQuestionIndex(0);
    setScore({ correct: 0, incorrect: 0 });
    setUserAnswers([]);
    setSelectedOption(null);
    setIsAnswerConfirmed(false);
    setIsExiting(false);
    setAppState('quiz');
  };

  const handleSelectOption = (index) => {
    if (isAnswerConfirmed) return;

    const currentQ = activeQuestions[currentQuestionIndex];
    if (!currentQ) return;

    setSelectedOption(index);
    setIsAnswerConfirmed(true);

    const isCorrect = index === currentQ.correctIndex;

    if (isCorrect) {
      setScore((prev) => ({ ...prev, correct: prev.correct + 1 }));
    } else {
      setScore((prev) => ({ ...prev, incorrect: prev.incorrect + 1 }));
    }

    setUserAnswers((prev) => [
      ...prev,
      {
        question: currentQ,
        selected: index,
        isCorrect: isCorrect
      }
    ]);

    clearAdvanceTimer();
    advanceTimerRef.current = setTimeout(() => {
      setCurrentQuestionIndex((prevIdx) => {
        if (prevIdx + 1 < activeQuestions.length) {
          setSelectedOption(null);
          setIsAnswerConfirmed(false);
          return prevIdx + 1;
        } else {
          setSelectedOption(null);
          setIsAnswerConfirmed(false);
          setAppState('end');
          return prevIdx;
        }
      });
    }, 5000);
  };

  const restartApp = () => {
    clearAdvanceTimer();
    setAppState('home');
    setInstrumentProfile('');
    setStudyLevel('');
    setQuizType('');
    setIsExiting(false);
  };

  const renderContent = () => {
    if (appState === 'home') {
      return (
        <div className="flex flex-col items-center justify-center min-h-screen bg-slate-50 p-4 font-sans text-slate-800 pb-24">
          <div className="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl text-center relative overflow-hidden">
            <div className="mb-6 flex justify-center">
              <div className="w-20 h-20 bg-indigo-600 rounded-full flex items-center justify-center shadow-lg">
                <svg className="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
                </svg>
              </div>
            </div>
            <h1 className="text-3xl font-extrabold text-slate-900 mb-2">Solfeggio Allegro</h1>
            <p className="text-slate-500 mb-8 font-medium leading-tight">
              Simulador de Aprendizagem<br />da Teoria Musical
            </p>

            <div className="bg-slate-50 rounded-2xl p-5 mb-8 border border-slate-100 shadow-sm">
              <p className="text-slate-600 text-sm italic mb-4 font-medium text-justify leading-relaxed">
                "Que o seu esforço nos estudos musicais se transformem em um louvor perfeito e agradável a Deus."
              </p>
              <div className="bg-white p-4 rounded-xl border-l-4 border-indigo-500 shadow-sm transition-all duration-300">
                <p className="text-indigo-800 font-bold text-[15px] leading-snug text-justify">
                  "{currentVerse.text}"
                </p>
                <p className="text-indigo-500 text-[11px] font-bold mt-2 uppercase tracking-widest text-right">
                  — {currentVerse.ref}
                </p>
              </div>
            </div>

            <button
              type="button"
              onClick={() => setAppState('setup_profile')}
              className="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-md hover:bg-indigo-700 transition active:scale-95 text-lg"
            >
              Iniciar Simulado
            </button>
            <Signature />
          </div>
        </div>
      );
    }

    if (appState === 'setup_profile') {
      return (
        <div className="flex flex-col items-center min-h-screen bg-slate-50 p-4 font-sans pb-24">
          <div className="w-full max-w-md mt-10">
            <h2 className="text-2xl font-bold text-slate-800 mb-6 text-center">Qual o seu perfil?</h2>
            <div className="space-y-4">
              <button
                type="button"
                onClick={() => {
                  setInstrumentProfile('musico');
                  setAppState('setup_level');
                }}
                className="w-full bg-white border-2 border-slate-200 p-5 rounded-2xl text-left hover:border-indigo-500 transition shadow-sm flex items-center justify-between"
              >
                <div>
                  <p className="font-bold text-lg text-slate-800">Músico</p>
                  <p className="text-sm text-slate-500 mt-1 text-justify">Cordas, Madeiras e Metais</p>
                </div>
                <span className="text-2xl">🎷</span>
              </button>
              <button
                type="button"
                onClick={() => {
                  setInstrumentProfile('organista');
                  setAppState('setup_level');
                }}
                className="w-full bg-white border-2 border-slate-200 p-5 rounded-2xl text-left hover:border-indigo-500 transition shadow-sm flex items-center justify-between"
              >
                <div>
                  <p className="font-bold text-lg text-slate-800">Organista</p>
                  <p className="text-sm text-slate-500 mt-1 text-justify">Teclados</p>
                </div>
                <span className="text-2xl">🎹</span>
              </button>
            </div>
            <button
              type="button"
              onClick={restartApp}
              className="w-full mt-8 text-slate-500 font-semibold p-4 hover:bg-slate-200 rounded-xl transition"
            >
              Voltar
            </button>
            <Signature />
          </div>
        </div>
      );
    }

    if (appState === 'setup_level') {
      const rjmText = instrumentProfile === 'musico' ? 'Fase 1 à Fase 12' : 'Fase 1 à Fase 11';
      const cultoText = instrumentProfile === 'musico' ? 'Fase 1 à Fase 16' : 'Fase 1 à Fase 15';
      const oficializacaoText = 'MSA Completo';

      return (
        <div className="flex flex-col items-center min-h-screen bg-slate-50 p-4 font-sans pb-24">
          <div className="w-full max-w-md mt-10">
            <h2 className="text-2xl font-bold text-slate-800 mb-6 text-center">
              Para qual etapa você está se preparando?
            </h2>
            <div className="space-y-4">
              <button
                type="button"
                onClick={() => {
                  setStudyLevel('rjm');
                  setAppState('setup_quiz_type');
                }}
                className="w-full bg-white border-2 border-slate-200 p-4 rounded-2xl text-left hover:border-indigo-500 transition shadow-sm"
              >
                <p className="font-bold text-slate-800">Reunião de Jovens e Menores</p>
                <p className="text-xs text-slate-500 mt-1 text-justify">{rjmText}</p>
              </button>
              <button
                type="button"
                onClick={() => {
                  setStudyLevel('culto');
                  setAppState('setup_quiz_type');
                }}
                className="w-full bg-white border-2 border-slate-200 p-4 rounded-2xl text-left hover:border-indigo-500 transition shadow-sm"
              >
                <p className="font-bold text-slate-800">Culto Oficial</p>
                <p className="text-xs text-slate-500 mt-1 text-justify">{cultoText}</p>
              </button>
              <button
                type="button"
                onClick={() => {
                  setStudyLevel('oficializacao');
                  setAppState('setup_quiz_type');
                }}
                className="w-full bg-white border-2 border-slate-200 p-4 rounded-2xl text-left hover:border-indigo-500 transition shadow-sm"
              >
                <p className="font-bold text-slate-800">Oficialização</p>
                <p className="text-xs text-slate-500 mt-1 text-justify">{oficializacaoText}</p>
              </button>
            </div>
            <button
              type="button"
              onClick={() => setAppState('setup_profile')}
              className="w-full mt-6 text-slate-500 font-semibold p-4 hover:bg-slate-200 rounded-xl transition"
            >
              Voltar
            </button>
            <Signature />
          </div>
        </div>
      );
    }

    if (appState === 'setup_quiz_type') {
      return (
        <div className="flex flex-col items-center min-h-screen bg-slate-50 p-4 font-sans pb-24">
          <div className="w-full max-w-md mt-10">
            <h2 className="text-2xl font-bold text-slate-800 mb-6 text-center">
              Escolha o formato do simulado
            </h2>
            <div className="space-y-4">
              <button
                type="button"
                onClick={() => {
                  setQuizType('rapido');
                  startQuiz('rapido');
                }}
                className="w-full bg-white border-2 border-slate-200 p-5 rounded-2xl text-left hover:border-indigo-500 transition shadow-sm flex items-center justify-between"
              >
                <div>
                  <p className="font-bold text-lg text-slate-800">Teste Rápido</p>
                  <p className="text-sm text-slate-500 mt-1 text-justify">5 questões</p>
                </div>
                <span className="text-2xl">⚡</span>
              </button>
              <button
                type="button"
                onClick={() => {
                  setQuizType('simples');
                  startQuiz('simples');
                }}
                className="w-full bg-white border-2 border-slate-200 p-5 rounded-2xl text-left hover:border-indigo-500 transition shadow-sm flex items-center justify-between"
              >
                <div>
                  <p className="font-bold text-lg text-slate-800">Simples</p>
                  <p className="text-sm text-slate-500 mt-1 text-justify">20 questões</p>
                </div>
              </button>
              <button
                type="button"
                onClick={() => {
                  setQuizType('completo');
                  startQuiz('completo');
                }}
                className="w-full bg-white border-2 border-slate-200 p-5 rounded-2xl text-left hover:border-indigo-500 transition shadow-sm flex items-center justify-between"
              >
                <div>
                  <p className="font-bold text-lg text-slate-800">Completo</p>
                  <p className="text-sm text-slate-500 mt-1 text-justify">40 questões</p>
                </div>
              </button>
            </div>
            <button
              type="button"
              onClick={() => setAppState('setup_level')}
              className="w-full mt-8 text-slate-500 font-semibold p-4 hover:bg-slate-200 rounded-xl transition"
            >
              Voltar
            </button>
            <Signature />
          </div>
        </div>
      );
    }

    if (appState === 'quiz') {
      const currentQ = activeQuestions[currentQuestionIndex];
      if (!currentQ) return null;

      const progress = (currentQuestionIndex / activeQuestions.length) * 100;
      const phaseLabel = currentQ.isMooExtra ? 'Extra — MOO' : `Fase ${currentQ.fase}`;

      return (
        <div className="flex flex-col min-h-screen bg-slate-50 font-sans relative pb-24">
          {/* Modal de Cancelamento */}
          {isExiting && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl">
                <div className="text-5xl mb-4">⚠️</div>
                <h3 className="text-xl font-bold text-slate-800 mb-2">
                  Tem certeza que quer parar o simulado?
                </h3>
                <p className="text-slate-500 text-sm mb-6 text-justify">
                  Todo o seu progresso atual será perdido.
                </p>
                <div className="flex gap-3">
                  <button
                    type="button"
                    onClick={() => setIsExiting(false)}
                    className="flex-1 bg-slate-100 text-slate-600 font-bold py-3 rounded-xl hover:bg-slate-200 transition"
                  >
                    Continuar
                  </button>
                  <button
                    type="button"
                    onClick={restartApp}
                    className="flex-1 bg-rose-500 text-white font-bold py-3 rounded-xl hover:bg-rose-600 transition"
                  >
                    Sair
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Header do Quiz */}
          <div className="bg-white shadow-sm pt-6 pb-4 px-6 sticky top-0 z-10 flex flex-col">
            <div className="flex justify-between items-start mb-4">
              <div>
                <p className="text-xs font-bold text-indigo-600 tracking-wider uppercase">{phaseLabel}</p>
                <p className="font-bold text-slate-800 text-lg">
                  Questão {currentQuestionIndex + 1} de {activeQuestions.length}
                </p>
              </div>
              <div className="flex items-center gap-4">
                <div className="flex gap-3 text-sm font-bold">
                  <div className="flex items-center text-emerald-600">
                    <span className="mr-1">✓</span> {score.correct}
                  </div>
                  <div className="flex items-center text-rose-500">
                    <span className="mr-1">✗</span> {score.incorrect}
                  </div>
                </div>
                <button
                  type="button"
                  onClick={() => setIsExiting(true)}
                  className="w-8 h-8 flex items-center justify-center bg-rose-50 text-rose-600 rounded-full font-bold hover:bg-rose-100 transition"
                  title="Sair do Simulado"
                >
                  ✕
                </button>
              </div>
            </div>
            <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
              <div
                className="bg-indigo-600 h-full rounded-full transition-all duration-300"
                style={{ width: `${progress}%` }}
              ></div>
            </div>
          </div>

          {/* Corpo da Pergunta */}
          <div className="flex-1 p-6 flex flex-col max-w-xl mx-auto w-full">
            <h2 className="text-xl font-bold text-slate-800 mb-6 leading-snug text-justify">
              {currentQ.question}
            </h2>

            <div className="space-y-3">
              {currentQ.options.map((option, idx) => {
                const isCorrectOption = idx === currentQ.correctIndex;
                const isWrongSelected = isAnswerConfirmed && idx === selectedOption && !isCorrectOption;

                let btnClass =
                  'w-full text-justify p-4 border-2 transition-all font-medium text-[15px] flex items-center gap-3';

                if (!isAnswerConfirmed) {
                  btnClass +=
                    ' rounded-2xl border-slate-200 bg-white text-slate-700 active:bg-slate-50 hover:border-indigo-200';
                } else if (isCorrectOption) {
                  btnClass +=
                    ' rounded-t-2xl rounded-b-none border-b-0 border-emerald-500 bg-emerald-50 text-emerald-900';
                } else if (isWrongSelected) {
                  btnClass +=
                    ' rounded-2xl border-rose-500 bg-rose-50 text-rose-800';
                } else {
                  btnClass +=
                    ' rounded-2xl border-slate-100 bg-slate-50 text-slate-400 opacity-50';
                }

                return (
                  <div key={`${currentQuestionIndex}-${idx}`} className="w-full">
                    <button
                      type="button"
                      onClick={() => handleSelectOption(idx)}
                      className={btnClass}
                      disabled={isAnswerConfirmed}
                    >
                      <div
                        className={`w-6 h-6 shrink-0 rounded-full border-2 flex items-center justify-center text-xs font-bold transition-colors
                        ${!isAnswerConfirmed ? 'border-slate-300 text-slate-500 bg-white' : ''}
                        ${isAnswerConfirmed && isCorrectOption ? 'border-emerald-500 bg-emerald-500 text-white' : ''}
                        ${isWrongSelected ? 'border-rose-500 bg-rose-500 text-white' : ''}
                        ${isAnswerConfirmed && !isCorrectOption && !isWrongSelected ? 'border-slate-200 text-slate-300 bg-slate-100' : ''}
                      `}
                      >
                        {['A', 'B', 'C', 'D'][idx]}
                      </div>
                      <div className="flex flex-col w-full text-justify">
                        <span>{option}</span>
                      </div>
                    </button>

                    {isAnswerConfirmed && isCorrectOption && (
                      <div className="w-full px-4 pb-4 pt-3 rounded-b-2xl border-2 border-t border-emerald-500 bg-emerald-50/90 text-emerald-950 shadow-sm">
                        <p className="font-bold text-xs uppercase tracking-wider mb-1.5 text-emerald-800">
                          {selectedOption === currentQ.correctIndex
                            ? '✓ Você acertou! Justificativa:'
                            : '✓ Alternativa Correta — Justificativa:'}
                        </p>
                        <p className="text-sm leading-relaxed text-slate-700 text-justify mb-2">
                          {currentQ.exp}
                        </p>
                        <p className="text-xs font-bold uppercase tracking-wider text-indigo-700 pt-1.5 border-t border-emerald-200">
                          Referência: {currentQ.ref}
                        </p>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            <Signature />
          </div>
        </div>
      );
    }

    if (appState === 'end') {
      const nextQuizButtonLabel =
        quizType === 'rapido' ? 'Fazer Mais 5 Questões' : 'Novo Simulado';
      return (
        <div className="flex flex-col items-center justify-center min-h-screen bg-slate-50 p-4 font-sans text-slate-800 pb-24">
          <div className="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl text-center">
            <div className="text-6xl mb-4">
              {score.correct > activeQuestions.length * 0.7 ? '🏆' : '📚'}
            </div>
            <h2 className="text-3xl font-extrabold text-slate-900 mb-2">Simulado Concluído!</h2>
            <p className="text-slate-500 mb-8 font-medium text-center">
              Aqui está o seu desempenho geral:
            </p>
            <div className="flex justify-center gap-4 mb-8">
              <div className="bg-emerald-50 border border-emerald-100 rounded-2xl p-4 w-32">
                <p className="text-3xl font-black text-emerald-600">{score.correct}</p>
                <p className="text-sm font-bold text-emerald-800 uppercase mt-1">Acertos</p>
              </div>
              <div className="bg-rose-50 border border-rose-100 rounded-2xl p-4 w-32">
                <p className="text-3xl font-black text-rose-500">{score.incorrect}</p>
                <p className="text-sm font-bold text-rose-800 uppercase mt-1">Erros</p>
              </div>
            </div>
            <div className="space-y-3">
              <button
                type="button"
                onClick={() => setAppState('review')}
                className="w-full bg-indigo-50 text-indigo-700 border-2 border-indigo-200 font-bold py-4 rounded-xl hover:bg-indigo-100 transition active:scale-95 text-lg"
              >
                Revisar Questões
              </button>
              <button
                type="button"
                onClick={() => startQuiz(quizType)}
                className="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-md hover:bg-indigo-700 transition active:scale-95 text-lg"
              >
                {nextQuizButtonLabel}
              </button>
              <button
                type="button"
                onClick={restartApp}
                className="w-full bg-slate-100 text-slate-600 font-bold py-4 rounded-xl hover:bg-slate-200 transition active:scale-95 text-lg mt-4"
              >
                Voltar ao Início
              </button>
            </div>
            <Signature />
          </div>
        </div>
      );
    }

    if (appState === 'review') {
      return (
        <div className="flex flex-col min-h-screen bg-slate-50 font-sans pb-24">
          <div className="bg-white shadow-sm p-4 sticky top-0 z-10 flex items-center">
            <button
              type="button"
              onClick={() => setAppState('end')}
              className="text-indigo-600 font-bold p-2 mr-2 hover:bg-indigo-50 rounded-lg transition"
            >
              ← Voltar
            </button>
            <h2 className="text-lg font-bold text-slate-800">Revisão do Simulado</h2>
          </div>
          <div className="p-4 max-w-xl mx-auto w-full space-y-6 pb-20">
            {userAnswers.map((item, index) => (
              <div
                key={index}
                className={`bg-white p-5 rounded-2xl border-2 ${
                  item.isCorrect ? 'border-emerald-200' : 'border-rose-200'
                } shadow-sm`}
              >
                <div className="flex gap-2 items-start mb-3">
                  <span
                    className={`text-xl ${
                      item.isCorrect ? 'text-emerald-500' : 'text-rose-500'
                    }`}
                  >
                    {item.isCorrect ? '✓' : '✗'}
                  </span>
                  <p className="font-bold text-slate-800 leading-snug text-justify">
                    {index + 1}. {item.question.question}
                  </p>
                </div>
                <div className="pl-7 space-y-2 mt-4 text-sm">
                  {!item.isCorrect && (
                    <div className="p-3 bg-rose-50 text-rose-800 rounded-lg border border-rose-100 text-justify">
                      <span className="font-bold text-xs uppercase tracking-wider block mb-1">
                        Sua resposta:
                      </span>
                      {item.question.options[item.selected]}
                    </div>
                  )}
                  <div className="p-3 bg-emerald-50 text-emerald-800 rounded-lg border border-emerald-100 text-justify">
                    <span className="font-bold text-xs uppercase tracking-wider block mb-1">
                      Resposta correta:
                    </span>
                    {item.question.options[item.question.correctIndex]}
                  </div>
                  <div className="p-3 bg-slate-50 text-slate-700 rounded-lg border border-slate-200 text-justify">
                    <span className="font-bold text-xs uppercase tracking-wider block mb-1 text-indigo-700">
                      Justificativa &amp; Referência ({item.question.ref}):
                    </span>
                    {item.question.exp}
                  </div>
                </div>
              </div>
            ))}
            <Signature />
          </div>
        </div>
      );
    }

    return null;
  };


      return <React.Fragment>{renderContent()}</React.Fragment>;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SolfeggioAllegro />);
  </script>
</body>
</html>
